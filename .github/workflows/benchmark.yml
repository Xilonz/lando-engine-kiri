name: Performance Benchmark (Kiri vs Docker)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/benchmark.yml'
      - '.github/scripts/**'
  schedule:
    # Run weekly on Sunday at 02:00 UTC to catch new Kiri/Docker releases automatically
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  bench-docker:
    name: Benchmark Docker Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lando
        uses: lando/setup-lando@v3
        with:
          lando-version: stable

      - name: Ensure ports 80 and 443 are free
        run: sudo systemctl stop nginx apache2 || true

      - name: Verify Docker Engine Version
        run: |
          docker version
          docker info

      - name: Prepare test app
        run: |
          mkdir -p /tmp/bench-app/fixtures
          cd /tmp/bench-app
          cat << 'EOF' > .lando.yml
          name: bench-app
          services:
            web:
              api: 4
              type: l337
              image: php:8.2-cli-alpine
              command: php -S 0.0.0.0:80 -t /app
              stop_signal: SIGINT
              ports:
                - "80"
              volumes:
                - .:/app
          tooling:
            php:
              service: web
          EOF
          echo "<?php echo 'ok';" > index.php

          # Create 1,000 fixture PHP files to measure bind mount I/O performance
          for i in {1..1000}; do
            echo "<?php return 'fixture_data_$i';" > fixtures/file_$i.php
          done

      - name: Run Cold Start & Teardown Benchmark (10 iterations averaged)
        run: |
          cd /tmp/bench-app
          BOOT_TOTAL=0
          DESTROY_TOTAL=0
          for i in {1..10}; do
            S=$(date +%s%3N)
            lando start -y
            E=$(date +%s%3N)
            BOOT_TOTAL=$((BOOT_TOTAL + E - S))

            # Keep container running on the 10th iteration for subsequent tests
            if [ $i -lt 10 ]; then
              S=$(date +%s%3N)
              lando destroy -y
              E=$(date +%s%3N)
              DESTROY_TOTAL=$((DESTROY_TOTAL + E - S))
            fi
          done
          BOOT_MS=$((BOOT_TOTAL / 10))
          echo "BOOT_MS=$BOOT_MS" >> $GITHUB_ENV
          echo "DESTROY_TOTAL=$DESTROY_TOTAL" >> $GITHUB_ENV
          echo "Docker 10x avg cold start took ${BOOT_MS} ms"

      - name: Run Warm Restart Benchmark (10 iterations averaged)
        run: |
          cd /tmp/bench-app
          WARM_TOTAL=0
          for i in {1..10}; do
            S=$(date +%s%3N)
            lando restart -y
            E=$(date +%s%3N)
            WARM_TOTAL=$((WARM_TOTAL + E - S))
          done
          WARM_MS=$((WARM_TOTAL / 10))
          echo "WARM_MS=$WARM_MS" >> $GITHUB_ENV
          echo "Docker 10x avg warm restart took ${WARM_MS} ms"

      - name: Run CLI Exec Benchmark (100 iterations)
        run: |
          cd /tmp/bench-app
          START=$(date +%s%3N)
          for i in {1..100}; do
            lando php -r "echo 'ok';" > /dev/null
          done
          END=$(date +%s%3N)
          EXEC_MS=$((END - START))
          echo "EXEC_MS=$EXEC_MS" >> $GITHUB_ENV
          echo "Docker 100x CLI exec took ${EXEC_MS} ms"

      - name: Run Bind Mount Filesystem I/O Benchmark (1,000 files, 10 passes averaged)
        run: |
          cd /tmp/bench-app
          RAW_IO=$(lando php -r '
            $totalTime = 0;
            for ($p = 0; $p < 10; $p++) {
              $t = microtime(true);
              $files = glob("fixtures/*.php");
              $sum = 0;
              foreach ($files as $f) {
                $sum += strlen(file_get_contents($f));
              }
              $totalTime += (microtime(true) - $t);
            }
            echo round(($totalTime / 10) * 1000);
          ')
          IO_MS=$(echo "$RAW_IO" | tail -n 1 | tr -dc '0-9')
          echo "IO_MS=${IO_MS:-0}" >> $GITHUB_ENV
          echo "Docker bind mount I/O (10 passes avg) took ${IO_MS:-0} ms"

      - name: Run HTTP Latency Benchmark (250 GET requests)
        run: |
          cd /tmp/bench-app
          APP_URL=$(lando info --format json | jq -r '.[].urls[]? | select(startswith("http://localhost:"))' | head -n 1)
          echo "Discovered app URL: $APP_URL"
          for i in {1..30}; do
            if curl -s "$APP_URL" | grep -q 'ok'; then
              echo "HTTP server ready!"
              break
            fi
            sleep 0.5
          done
          RAW_HTTP=$(node $GITHUB_WORKSPACE/.github/scripts/bench-http.js "$APP_URL" 250 10)
          HTTP_MS=$(echo "$RAW_HTTP" | tail -n 1 | tr -dc '0-9')
          echo "HTTP_MS=${HTTP_MS:-0}" >> $GITHUB_ENV
          echo "Docker 250 HTTP requests took ${HTTP_MS:-0} ms"

      - name: Benchmark Teardown (10th destroy & average calculation)
        run: |
          cd /tmp/bench-app
          S=$(date +%s%3N)
          lando destroy -y
          E=$(date +%s%3N)
          FULL_DESTROY=$(( ${{ env.DESTROY_TOTAL }} + E - S ))
          DESTROY_MS=$(( FULL_DESTROY / 10 ))
          echo "DESTROY_MS=$DESTROY_MS" >> $GITHUB_ENV
          echo "Docker 10x avg teardown took ${DESTROY_MS} ms"

      - name: Save Docker Metrics
        run: |
          mkdir -p results
          cat << EOF > results/docker.json
          {
            "engine": "docker",
            "cold_boot_ms": ${{ env.BOOT_MS }},
            "boot_runs": 10,
            "warm_restart_ms": ${{ env.WARM_MS }},
            "warm_runs": 10,
            "cli_exec_ms": ${{ env.EXEC_MS }},
            "cli_runs": 100,
            "io_read_ms": ${{ env.IO_MS }},
            "io_files": 1000,
            "io_passes": 10,
            "http_ms": ${{ env.HTTP_MS }},
            "http_requests": 250,
            "destroy_ms": ${{ env.DESTROY_MS }},
            "destroy_runs": 10
          }
          EOF

      - name: Upload Docker Result
        uses: actions/upload-artifact@v4
        with:
          name: docker-result
          path: results/docker.json

  bench-kiri:
    name: Benchmark Kiri Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lando
        uses: lando/setup-lando@v3
        with:
          lando-version: stable

      - name: Fetch and Install Latest Kiri
        run: |
          KIRI_VERSION=$(curl -s https://download.runkiri.com/latest.json | jq -r .version)
          echo "Latest Kiri version: $KIRI_VERSION"
          echo "KIRI_VERSION=$KIRI_VERSION" >> $GITHUB_ENV
          curl -fsSL "https://download.runkiri.com/kiri_${KIRI_VERSION}_amd64.deb" -o /tmp/kiri.deb
          sudo dpkg -i /tmp/kiri.deb || sudo apt-get install -f -y

      - name: Stop Docker & Start Kiri Daemon
        run: |
          sudo systemctl stop docker docker.socket containerd || true

          # Ensure packet forwarding is allowed
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -P FORWARD ACCEPT

          # Move Kiri domain router away from ports 80/443 so Lando's Traefik has exclusive access
          sudo mkdir -p /etc/systemd/system/kiri.service.d
          cat << 'EOF' | sudo tee /etc/systemd/system/kiri.service.d/ports.conf
          [Service]
          Environment=KIRI_HTTP_PORT=8880
          Environment=KIRI_HTTPS_PORT=8843
          EOF
          sudo systemctl daemon-reload

          sudo systemctl enable kiri
          sudo systemctl start kiri
          
          # Wait for Kiri socket
          for i in {1..30}; do
            if [ -S /run/kiri/docker.sock ]; then
              echo "Kiri socket ready!"
              break
            fi
            sleep 0.2
          done
          
          # Clean up any stale docker socket and symlink to Kiri
          sudo rm -f /var/run/docker.sock /run/docker.sock
          sudo ln -sf /run/kiri/docker.sock /var/run/docker.sock
          sudo ln -sf /run/kiri/docker.sock /run/docker.sock
          sudo chmod 666 /run/kiri/docker.sock /var/run/docker.sock /run/docker.sock || true
          sudo usermod -aG kiri runner || true

      - name: Install Lando Kiri Plugins
        run: |
          mkdir -p ~/.lando/plugins
          # Link current repo as lando-engine-kiri
          ln -s "$GITHUB_WORKSPACE" ~/.lando/plugins/lando-engine-kiri
          # Clone companion docker-modem patch plugin directly into ~/.lando/plugins
          git clone https://github.com/Xilonz/lando-patch-docker-modem.git ~/.lando/plugins/lando-patch-docker-modem
          lando --clear
          lando kiri-doctor

      - name: Ensure ports 80 and 443 are free
        run: sudo systemctl stop nginx apache2 || true

      - name: Verify Kiri Engine Version
        run: |
          docker version
          kiri --version || true

      - name: Prepare test app
        run: |
          mkdir -p /tmp/bench-app/fixtures
          cd /tmp/bench-app
          cat << 'EOF' > .lando.yml
          name: bench-app
          services:
            web:
              api: 4
              type: l337
              image: php:8.2-cli-alpine
              command: php -S 0.0.0.0:80 -t /app
              stop_signal: SIGINT
              ports:
                - "80"
              volumes:
                - .:/app
          tooling:
            php:
              service: web
          EOF
          echo "<?php echo 'ok';" > index.php

          # Create 1,000 fixture PHP files to measure bind mount I/O performance
          for i in {1..1000}; do
            echo "<?php return 'fixture_data_$i';" > fixtures/file_$i.php
          done

      - name: Run Cold Start & Teardown Benchmark (10 iterations averaged)
        run: |
          cd /tmp/bench-app
          BOOT_TOTAL=0
          DESTROY_TOTAL=0
          for i in {1..10}; do
            S=$(date +%s%3N)
            lando start -y
            E=$(date +%s%3N)
            BOOT_TOTAL=$((BOOT_TOTAL + E - S))

            # Keep container running on the 10th iteration for subsequent tests
            if [ $i -lt 10 ]; then
              S=$(date +%s%3N)
              lando destroy -y
              E=$(date +%s%3N)
              DESTROY_TOTAL=$((DESTROY_TOTAL + E - S))
            fi
          done
          BOOT_MS=$((BOOT_TOTAL / 10))
          echo "BOOT_MS=$BOOT_MS" >> $GITHUB_ENV
          echo "DESTROY_TOTAL=$DESTROY_TOTAL" >> $GITHUB_ENV
          echo "Kiri 10x avg cold start took ${BOOT_MS} ms"

      - name: Run Warm Restart Benchmark (10 iterations averaged)
        run: |
          cd /tmp/bench-app
          WARM_TOTAL=0
          for i in {1..10}; do
            S=$(date +%s%3N)
            lando restart -y
            E=$(date +%s%3N)
            WARM_TOTAL=$((WARM_TOTAL + E - S))
          done
          WARM_MS=$((WARM_TOTAL / 10))
          echo "WARM_MS=$WARM_MS" >> $GITHUB_ENV
          echo "Kiri 10x avg warm restart took ${WARM_MS} ms"

      - name: Run CLI Exec Benchmark (100 iterations)
        run: |
          cd /tmp/bench-app
          START=$(date +%s%3N)
          for i in {1..100}; do
            lando php -r "echo 'ok';" > /dev/null
          done
          END=$(date +%s%3N)
          EXEC_MS=$((END - START))
          echo "EXEC_MS=$EXEC_MS" >> $GITHUB_ENV
          echo "Kiri 100x CLI exec took ${EXEC_MS} ms"

      - name: Run Bind Mount Filesystem I/O Benchmark (1,000 files, 10 passes averaged)
        run: |
          cd /tmp/bench-app
          RAW_IO=$(lando php -r '
            $totalTime = 0;
            for ($p = 0; $p < 10; $p++) {
              $t = microtime(true);
              $files = glob("fixtures/*.php");
              $sum = 0;
              foreach ($files as $f) {
                $sum += strlen(file_get_contents($f));
              }
              $totalTime += (microtime(true) - $t);
            }
            echo round(($totalTime / 10) * 1000);
          ')
          IO_MS=$(echo "$RAW_IO" | tail -n 1 | tr -dc '0-9')
          echo "IO_MS=${IO_MS:-0}" >> $GITHUB_ENV
          echo "Kiri bind mount I/O (10 passes avg) took ${IO_MS:-0} ms"

      - name: Run HTTP Latency Benchmark (250 GET requests)
        run: |
          cd /tmp/bench-app
          APP_URL=$(lando info --format json | jq -r '.[].urls[]? | select(startswith("http://localhost:"))' | head -n 1)
          echo "Discovered app URL: $APP_URL"
          for i in {1..30}; do
            if curl -s "$APP_URL" | grep -q 'ok'; then
              echo "HTTP server ready!"
              break
            fi
            sleep 0.5
          done
          RAW_HTTP=$(node $GITHUB_WORKSPACE/.github/scripts/bench-http.js "$APP_URL" 250 10)
          HTTP_MS=$(echo "$RAW_HTTP" | tail -n 1 | tr -dc '0-9')
          echo "HTTP_MS=${HTTP_MS:-0}" >> $GITHUB_ENV
          echo "Kiri 250 HTTP requests took ${HTTP_MS:-0} ms"

      - name: Benchmark Teardown (10th destroy & average calculation)
        run: |
          cd /tmp/bench-app
          S=$(date +%s%3N)
          lando destroy -y
          E=$(date +%s%3N)
          FULL_DESTROY=$(( ${{ env.DESTROY_TOTAL }} + E - S ))
          DESTROY_MS=$(( FULL_DESTROY / 10 ))
          echo "DESTROY_MS=$DESTROY_MS" >> $GITHUB_ENV
          echo "Kiri 10x avg teardown took ${DESTROY_MS} ms"

      - name: Save Kiri Metrics
        run: |
          mkdir -p results
          cat << EOF > results/kiri.json
          {
            "engine": "kiri",
            "kiri_version": "${{ env.KIRI_VERSION }}",
            "cold_boot_ms": ${{ env.BOOT_MS }},
            "boot_runs": 10,
            "warm_restart_ms": ${{ env.WARM_MS }},
            "warm_runs": 10,
            "cli_exec_ms": ${{ env.EXEC_MS }},
            "cli_runs": 100,
            "io_read_ms": ${{ env.IO_MS }},
            "io_files": 1000,
            "io_passes": 10,
            "http_ms": ${{ env.HTTP_MS }},
            "http_requests": 250,
            "destroy_ms": ${{ env.DESTROY_MS }},
            "destroy_runs": 10
          }
          EOF

      - name: Upload Kiri Result
        uses: actions/upload-artifact@v4
        with:
          name: kiri-result
          path: results/kiri.json

  report:
    name: Compare & Update README
    needs: [bench-docker, bench-kiri]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Docker result
        uses: actions/download-artifact@v4
        with:
          name: docker-result
          path: results

      - name: Download Kiri result
        uses: actions/download-artifact@v4
        with:
          name: kiri-result
          path: results

      - name: Process Results & Update README
        run: node .github/scripts/benchmark-reporter.js

      - name: Commit and push updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore(benchmark): update benchmark results & shields in README [skip ci]"
            git push origin main
          else
            echo "No changes in README.md"
          fi

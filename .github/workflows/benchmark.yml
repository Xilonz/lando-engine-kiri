name: Performance Benchmark (Kiri vs Docker)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/benchmark.yml'
      - 'scripts/**'
  schedule:
    # Run weekly on Sunday at 02:00 UTC to catch new Kiri/Docker releases automatically
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  bench-docker:
    name: Benchmark Docker Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lando
        uses: lando/setup-lando@v3
        with:
          lando-version: stable

      - name: Ensure ports 80, 443 and 8080 are free
        run: sudo systemctl stop nginx apache2 || true

      - name: Prepare test app
        run: |
          mkdir -p /tmp/bench-app/fixtures
          cd /tmp/bench-app
          cat << 'EOF' > .lando.yml
          name: bench-app
          recipe: lamp
          config:
            webroot: .
            php: '8.2'
            composer_version: false
            database: mariadb:10.11
          services:
            appserver:
              overrides:
                ports:
                  - "8080:80"
            database:
              overrides:
                user: "1001:0"
          EOF
          echo "<?php echo 'ok';" > index.php

          # Create 500 fixture PHP files to measure bind mount I/O performance
          for i in {1..500}; do
            echo "<?php return 'fixture_data_$i';" > fixtures/file_$i.php
          done

      - name: Run Cold Boot Benchmark (Pull & Start from scratch)
        run: |
          cd /tmp/bench-app
          START=$(date +%s%3N)
          lando start -y
          END=$(date +%s%3N)
          BOOT_MS=$((END - START))
          echo "BOOT_MS=$BOOT_MS" >> $GITHUB_ENV
          echo "Docker cold boot took ${BOOT_MS} ms"

      - name: Run Warm Restart Benchmark (lando restart)
        run: |
          cd /tmp/bench-app
          START=$(date +%s%3N)
          lando restart -y
          END=$(date +%s%3N)
          WARM_MS=$((END - START))
          echo "WARM_MS=$WARM_MS" >> $GITHUB_ENV
          echo "Docker warm restart took ${WARM_MS} ms"

      - name: Run CLI Exec Benchmark (20 iterations)
        run: |
          cd /tmp/bench-app
          START=$(date +%s%3N)
          for i in {1..20}; do
            lando php -r "echo 'ok';" > /dev/null
          done
          END=$(date +%s%3N)
          EXEC_MS=$((END - START))
          echo "EXEC_MS=$EXEC_MS" >> $GITHUB_ENV
          echo "Docker 20x CLI exec took ${EXEC_MS} ms"

      - name: Run Bind Mount Filesystem I/O Benchmark (500 files)
        run: |
          cd /tmp/bench-app
          RAW_IO=$(lando php -r '
            $t = microtime(true);
            $files = glob("fixtures/*.php");
            $total = 0;
            foreach ($files as $f) {
              $total += strlen(file_get_contents($f));
            }
            echo round((microtime(true) - $t) * 1000);
          ')
          IO_MS=$(echo "$RAW_IO" | tail -n 1 | tr -dc '0-9')
          echo "IO_MS=${IO_MS:-0}" >> $GITHUB_ENV
          echo "Docker bind mount I/O took ${IO_MS:-0} ms"

      - name: Run HTTP Latency Benchmark (100 GET requests)
        run: |
          cd /tmp/bench-app
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080 | grep -q 'ok'; then
              echo "HTTP server ready!"
              break
            fi
            sleep 0.5
          done
          RAW_HTTP=$(node $GITHUB_WORKSPACE/scripts/bench-http.js http://127.0.0.1:8080/ 100)
          HTTP_MS=$(echo "$RAW_HTTP" | tail -n 1 | tr -dc '0-9')
          echo "HTTP_MS=${HTTP_MS:-0}" >> $GITHUB_ENV
          echo "Docker 100 HTTP requests took ${HTTP_MS:-0} ms"

      - name: Teardown test app
        run: |
          cd /tmp/bench-app
          lando destroy -y

      - name: Save Docker Metrics
        run: |
          mkdir -p results
          cat << EOF > results/docker.json
          {
            "engine": "docker",
            "cold_boot_ms": ${{ env.BOOT_MS }},
            "warm_restart_ms": ${{ env.WARM_MS }},
            "cli_exec_ms": ${{ env.EXEC_MS }},
            "cli_runs": 20,
            "io_read_ms": ${{ env.IO_MS }},
            "io_files": 500,
            "http_ms": ${{ env.HTTP_MS }},
            "http_requests": 100
          }
          EOF

      - name: Upload Docker Result
        uses: actions/upload-artifact@v4
        with:
          name: docker-result
          path: results/docker.json

  bench-kiri:
    name: Benchmark Kiri Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lando
        uses: lando/setup-lando@v3
        with:
          lando-version: stable

      - name: Fetch and Install Latest Kiri
        run: |
          KIRI_VERSION=$(curl -s https://download.runkiri.com/latest.json | jq -r .version)
          echo "Latest Kiri version: $KIRI_VERSION"
          echo "KIRI_VERSION=$KIRI_VERSION" >> $GITHUB_ENV
          curl -fsSL "https://download.runkiri.com/kiri_${KIRI_VERSION}_amd64.deb" -o /tmp/kiri.deb
          sudo dpkg -i /tmp/kiri.deb || sudo apt-get install -f -y

      - name: Stop Docker & Start Kiri Daemon
        run: |
          sudo systemctl stop docker docker.socket containerd || true

          # Ensure packet forwarding is allowed
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -P FORWARD ACCEPT

          sudo systemctl enable kiri
          sudo systemctl start kiri
          
          # Wait for Kiri socket
          for i in {1..30}; do
            if [ -S /run/kiri/docker.sock ]; then
              echo "Kiri socket ready!"
              break
            fi
            sleep 0.2
          done
          
          # Clean up any stale docker socket and symlink to Kiri
          sudo rm -f /var/run/docker.sock /run/docker.sock
          sudo ln -sf /run/kiri/docker.sock /var/run/docker.sock
          sudo ln -sf /run/kiri/docker.sock /run/docker.sock
          sudo chmod 666 /run/kiri/docker.sock /var/run/docker.sock /run/docker.sock || true
          sudo usermod -aG kiri runner || true

      - name: Install Lando Kiri Plugins
        run: |
          mkdir -p ~/.lando/plugins
          # Link current repo as lando-engine-kiri
          ln -s "$GITHUB_WORKSPACE" ~/.lando/plugins/lando-engine-kiri
          # Clone companion docker-modem patch plugin directly into ~/.lando/plugins
          git clone https://github.com/Xilonz/lando-patch-docker-modem.git ~/.lando/plugins/lando-patch-docker-modem
          lando --clear
          lando kiri-doctor

      - name: Ensure ports 80, 443 and 8080 are free
        run: sudo systemctl stop nginx apache2 || true

      - name: Prepare test app
        run: |
          mkdir -p /tmp/bench-app/fixtures
          cd /tmp/bench-app
          cat << 'EOF' > .lando.yml
          name: bench-app
          recipe: lamp
          config:
            webroot: .
            php: '8.2'
            composer_version: false
            database: mariadb:10.11
          services:
            appserver:
              overrides:
                ports:
                  - "8080:80"
            database:
              overrides:
                user: "1001:0"
          EOF
          echo "<?php echo 'ok';" > index.php

          # Create 500 fixture PHP files to measure bind mount I/O performance
          for i in {1..500}; do
            echo "<?php return 'fixture_data_$i';" > fixtures/file_$i.php
          done

      - name: Run Cold Boot Benchmark (Pull & Start from scratch)
        run: |
          cd /tmp/bench-app
          START=$(date +%s%3N)
          lando start -y
          END=$(date +%s%3N)
          BOOT_MS=$((END - START))
          echo "BOOT_MS=$BOOT_MS" >> $GITHUB_ENV
          echo "Kiri cold boot took ${BOOT_MS} ms"

      - name: Run Warm Restart Benchmark (lando restart)
        run: |
          cd /tmp/bench-app
          START=$(date +%s%3N)
          lando restart -y
          END=$(date +%s%3N)
          WARM_MS=$((END - START))
          echo "WARM_MS=$WARM_MS" >> $GITHUB_ENV
          echo "Kiri warm restart took ${WARM_MS} ms"

      - name: Run CLI Exec Benchmark (20 iterations)
        run: |
          cd /tmp/bench-app
          START=$(date +%s%3N)
          for i in {1..20}; do
            lando php -r "echo 'ok';" > /dev/null
          done
          END=$(date +%s%3N)
          EXEC_MS=$((END - START))
          echo "EXEC_MS=$EXEC_MS" >> $GITHUB_ENV
          echo "Kiri 20x CLI exec took ${EXEC_MS} ms"

      - name: Run Bind Mount Filesystem I/O Benchmark (500 files)
        run: |
          cd /tmp/bench-app
          RAW_IO=$(lando php -r '
            $t = microtime(true);
            $files = glob("fixtures/*.php");
            $total = 0;
            foreach ($files as $f) {
              $total += strlen(file_get_contents($f));
            }
            echo round((microtime(true) - $t) * 1000);
          ')
          IO_MS=$(echo "$RAW_IO" | tail -n 1 | tr -dc '0-9')
          echo "IO_MS=${IO_MS:-0}" >> $GITHUB_ENV
          echo "Kiri bind mount I/O took ${IO_MS:-0} ms"

      - name: Run HTTP Latency Benchmark (100 GET requests)
        run: |
          cd /tmp/bench-app
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080 | grep -q 'ok'; then
              echo "HTTP server ready!"
              break
            fi
            sleep 0.5
          done
          RAW_HTTP=$(node $GITHUB_WORKSPACE/scripts/bench-http.js http://127.0.0.1:8080/ 100)
          HTTP_MS=$(echo "$RAW_HTTP" | tail -n 1 | tr -dc '0-9')
          echo "HTTP_MS=${HTTP_MS:-0}" >> $GITHUB_ENV
          echo "Kiri 100 HTTP requests took ${HTTP_MS:-0} ms"

      - name: Teardown test app
        run: |
          cd /tmp/bench-app
          lando destroy -y

      - name: Save Kiri Metrics
        run: |
          mkdir -p results
          cat << EOF > results/kiri.json
          {
            "engine": "kiri",
            "kiri_version": "${{ env.KIRI_VERSION }}",
            "cold_boot_ms": ${{ env.BOOT_MS }},
            "warm_restart_ms": ${{ env.WARM_MS }},
            "cli_exec_ms": ${{ env.EXEC_MS }},
            "cli_runs": 20,
            "io_read_ms": ${{ env.IO_MS }},
            "io_files": 500,
            "http_ms": ${{ env.HTTP_MS }},
            "http_requests": 100
          }
          EOF

      - name: Upload Kiri Result
        uses: actions/upload-artifact@v4
        with:
          name: kiri-result
          path: results/kiri.json

  report:
    name: Compare & Update README
    needs: [bench-docker, bench-kiri]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Docker result
        uses: actions/download-artifact@v4
        with:
          name: docker-result
          path: results

      - name: Download Kiri result
        uses: actions/download-artifact@v4
        with:
          name: kiri-result
          path: results

      - name: Process Results & Update README
        run: node scripts/benchmark-reporter.js

      - name: Commit and push updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore(benchmark): update benchmark results & shields in README [skip ci]"
            git push origin main
          else
            echo "No changes in README.md"
          fi
